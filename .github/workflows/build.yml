name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew --no-daemon buildAndCollect runGameTest
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: anri-logger
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: checkout release source
        uses: actions/checkout@v6
      - name: download tested JARs
        uses: actions/download-artifact@v8
        with:
          name: anri-logger
          path: build/libs
      - name: validate release and prepare checksums
        shell: bash
        run: |
          version=$(sed -n 's/^mod.version = "\(.*\)"$/\1/p' stonecutter.properties.toml)
          test "$RELEASE_TAG" = "v$version"
          test -s "build/libs/anri-logger-${version}+mc26.1.2.jar"
          test -s "build/libs/anri-logger-${version}+mc26.1.2-sources.jar"
          test -s "docs/releases/${version}.md"
          (cd build/libs && sha256sum *.jar > SHA256SUMS.txt)
      - name: publish release with tested assets
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" build/libs/*.jar build/libs/SHA256SUMS.txt \
            --verify-tag --latest \
            --title "Anri Logger ${version} · Minecraft 26.1.2" \
            --notes-file "docs/releases/${version}.md"
